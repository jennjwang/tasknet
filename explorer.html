<style>
/* TaskNet (left) and O*NET (right) as a Venn; the overlap holds linked tasks, as in the paper's figure. Type and palette follow the paper's figure. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --ink:#16182B; --muted:rgba(22,24,43,.6); --rule:rgba(22,24,43,.1);
  /* palette from the paper's pair-relation Venn figure */
  --s:#4347C7; --s-fill:#BABCEB; --s-line:#9296DF; --s-ink:#292D72; --s-tint:#EEEEF9;
  --o:#34826B; --o-fill:#ABD2CA; --o-line:#7DB7AB; --o-ink:#225345; --o-tint:#E8F2EF;
  --x-fill:#92B1C8;
  --f-sans:"Public Sans","Helvetica Neue",Arial,system-ui,sans-serif;   /* the U.S. government's typeface, at home beside O*NET */
  --f-serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html{overflow:hidden}
body{margin:0;color:var(--ink);font-family:var(--f-sans);-webkit-font-smoothing:antialiased}
html{background:transparent}   /* embedded: the dashboard draws the paper */
.paper{position:fixed;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none}
/* scroll and tell: story steps scroll on the left while the Venn stays pinned on the right; both sit in the vertical middle of the screen */
.scrolly{width:100%;margin:0 auto;display:grid;grid-template-columns:minmax(300px,.85fr) minmax(0,1.15fr);gap:80px}
.story{grid-column:1;grid-row:1;padding-block:64px 0;display:grid;align-content:start}   /* pinned to the top, so a longer task never shifts it */
/* each step's text fades with the scroll itself (--o, set from its position), not on a timer, so it follows the reader's pace */
.step{min-height:72vh;display:grid;align-content:center;opacity:var(--fade,0)}
.step.linger{opacity:1}
.step p{margin:0;font-size:20.5px;line-height:1.55;max-width:36ch;text-wrap:pretty}
.step p b{font-weight:700}
/* a highlighter swipe behind each bold word once its step is on, in the colour of the region it names (lavender by default).
   Drawn as a background so it follows the words when a phrase wraps onto the next line */
.step p b{--hc:color-mix(in srgb, var(--hl, var(--s-fill)) 70%, transparent);background:linear-gradient(var(--hc),var(--hc)) no-repeat 0 85%/0% 62%;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .12em;margin:0 -.12em;border-radius:2px 5px 3px 6px;transition:background-size .15s}
.step.on p b{background-size:100% 62%;transition:background-size .55s cubic-bezier(.45,0,.25,1) calc(.35s + var(--i, 0)*.4s)}
@media (prefers-reduced-motion: reduce){.step.on p b{transition:none}}

.step p + p, .step p + blockquote, .step blockquote + p, .step blockquote + blockquote{margin-top:16px}
.step h1{margin-bottom:18px}
/* a mock of the interviewer, under the step that introduces it: the exchange plays in turn once the step is on */
.chat{display:grid;gap:8px;max-width:38ch;margin-top:22px;font-size:16px;line-height:1.45}
.chat-note{font-size:14px;color:var(--muted)}
.chat .q,.chat .a{opacity:0;translate:0 6px;transition:opacity .6s, translate .6s}
.step.on .chat .q,.step.on .chat .a{opacity:1;translate:0 0;transition-delay:calc(.5s + var(--i)*1.1s)}
.chat .q{justify-self:start;max-width:85%;padding:8px 12px;border:1px solid var(--rule);border-radius:10px 10px 10px 3px;background:var(--bg)}
.chat .a{justify-self:end;max-width:85%;padding:8px 12px;border-radius:10px 10px 3px 10px;background:var(--s-tint);color:var(--s-ink)}
/* the follow-up adapts to the answer and asks about what is missing */
.chat .follow em{display:block;margin-bottom:2px;font-size:13px;font-style:normal;font-weight:600;color:var(--s)}
@media (prefers-reduced-motion: reduce){.step.on .chat .q,.step.on .chat .a{transition:none}}
blockquote{margin:0;max-width:38ch;padding-left:14px;border-left:2px solid var(--q, var(--s));font-size:17px;line-height:1.5}
blockquote cite{display:block;margin-top:6px;font-style:normal;font-size:14.5px;color:var(--muted)}
.step.explore{gap:28px;min-height:0;opacity:1}
/* buttons under the Venn, right-aligned with its edge, shown once the reader reaches the explore step */
.ctas{position:absolute;left:0;top:0;translate:-50% 0;z-index:3;display:flex;gap:28px;opacity:0;pointer-events:none;transition:opacity .4s}
.ctas.on{opacity:1;pointer-events:auto}
/* plain underlined text links, like the page's other controls */
.cta{font-size:19.5px;font-weight:600;color:var(--s-ink);text-decoration:none;white-space:nowrap;padding:2px 0;border-bottom:1px solid currentColor;transition:color .15s}
.cta:hover{color:var(--s)}
.cta.here{color:var(--ink);border-bottom:2px solid var(--ink)}
.cta:focus-visible{outline:2px solid var(--s);outline-offset:3px}
.step.explore > p{max-width:none;color:var(--muted)}
.on-touch{display:none}
@media (hover:none){.on-hover{display:none} .on-touch{display:inline}}
@media (min-width:901px){.step.explore > p{white-space:nowrap}}
/* a quiet nudge to keep scrolling, shown after a few idle seconds on a story step */
.nudge{position:fixed;left:50%;bottom:22px;z-index:20;display:grid;justify-items:center;gap:2px;font-size:14px;font-weight:500;letter-spacing:.04em;color:var(--muted);pointer-events:none;opacity:0;translate:-50% 6px;transition:opacity .6s, translate .6s}
.nudge.show{opacity:1;translate:-50% 0}
.nudge svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@media (prefers-reduced-motion: reduce){.nudge svg{animation:none}}
.step.linger{min-height:160vh;align-content:start}
.step.linger > *{position:sticky;top:calc(50vh - 2.4em);transition:opacity .3s}
.step.linger:not(.on) > *{opacity:0}
.step.explore .chips{justify-content:flex-start}
.stage-wrap{grid-column:2;grid-row:1;align-self:center}   /* the Venn sits level with the middle of the panel */
@media (max-width:900px){
  .scrolly{grid-template-columns:minmax(0,1fr);gap:0}
  .stage-wrap{grid-column:1;grid-row:1;position:sticky;top:0;z-index:2;background:var(--bg);margin-inline:-20px;padding-inline:20px;box-shadow:0 1px 0 var(--rule)}
  .ctas{left:50%!important;translate:-50% 0;width:max-content;max-width:calc(100vw - 32px);flex-wrap:wrap;justify-content:center;gap:6px 18px}
  .cta{font-size:15px}
  .story{grid-column:1;grid-row:2;padding-block:0}
  .step{min-height:80vh;align-content:start;padding-top:3vh}
  .step.explore{min-height:0;padding:20px 0 48px}   /* the explorer sits straight under the Venn */
  .step p{font-size:19.5px}
  .step.linger > *{top:calc(54vh + 12px)}
  .callout{font-size:15px}
}
@media (min-width:640px){.nw{white-space:nowrap}}
h1{margin:0;font-size:clamp(24px,2.8vw,32px);font-weight:700;letter-spacing:-.02em;line-height:1.05}
h1 span{color:var(--s)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 13px}
.chip{font:inherit;font-size:15px;font-weight:500;white-space:nowrap;border:0;background:none;color:var(--muted);padding:4px 0;cursor:pointer;border-bottom:1.5px solid transparent;transition:color .15s,border-color .15s}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--s);outline-offset:3px}

/* equal padding above and below so the labels + Venn block sits in the vertical middle */
.stage{position:relative;height:660px;width:100%;min-width:0;padding:84px 0 0;display:grid;align-content:start}   /* counts line up with the hint text on the left; the circles end with the ratings */
@media (max-width:900px){.stage{position:relative;height:420px;padding:84px 0 8px}}   /* fixed: in the dashboard's frame, vh would grow with the frame */
canvas{display:block;margin:0 auto;touch-action:pan-y;outline:none}
.region{position:absolute;transition:opacity .4s;display:grid;justify-items:center;text-align:center;pointer-events:none;white-space:nowrap}
.region b{font-weight:700;font-size:clamp(32px,3.8vw,50px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.region span{margin-top:8px;font-size:24px;font-weight:600}
.region b i{font-style:normal} .region b em{font-style:normal;font-weight:400;opacity:.35;padding-inline:.12em}
#reg-S{color:var(--s-ink)} #reg-O{color:var(--o-ink)}
/* each count takes its own region's colour: TaskNet purple, the overlap's blue-grey, O*NET green */
#reg-L{color:#3438A8} #reg-X{color:#3F6585} #reg-R{color:#276650}   /* darker shades, still each region's hue */
.region.off{opacity:0}
/* nothing shows until the fonts are in and the first frame is drawn, then the page fades in */
.scrolly{transition:opacity .6s}
body.loading .scrolly{opacity:0}
/* a task's text that shrinks and glides into its dot, to show what each dot stands for */
/* callout, after the paper's figure: a task's text below the Venn, joined to its dot by a thin leader line */
.lead{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
/* like a pen: first a loop is drawn round the dot, then the line runs out from it to the text, then the text appears */
.lead path{fill:none;stroke:var(--q, var(--o));stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:opacity .4s}
.lead g.show .ring{stroke-dashoffset:0;transition:stroke-dashoffset .3s cubic-bezier(.45,0,.25,1)}
.lead g.show .line{stroke-dashoffset:0;transition:stroke-dashoffset .3s cubic-bezier(.45,0,.25,1) .25s}
/* the line ends in a hand-drawn arrowhead at the text, two short strokes added once the line is done */
.lead g.show .head{stroke-dashoffset:0;transition:stroke-dashoffset .15s ease-out .55s}
.lead g.gone path{opacity:0;transition:opacity .4s}
.lead g.gone path{stroke-dashoffset:0}
.callout{position:absolute;left:0;top:0;width:220px;font-size:16px;line-height:1.45;color:var(--ink);pointer-events:none;opacity:0;translate:0 4px;transition:opacity .4s, translate .4s}
.callout.show{opacity:1;translate:0 0;transition-delay:.55s}
.callout .par{display:block;color:var(--o-ink);font-size:15px}
.callout .by{display:block;margin:4px 0 2px;font-size:13px;font-weight:600;color:var(--s)}
/* fan view: one broad O*NET task under the Venn, with a pen line out to each TaskNet statement that refines it */
.fan-card{position:absolute;left:0;top:0;font-size:15.5px;line-height:1.45;color:var(--ink);pointer-events:none;opacity:0;translate:0 4px;transition:opacity .4s, translate .4s}
.fan-card.show{opacity:1;translate:0 0;transition-delay:.6s}
.fan-card .k{display:block;font-size:14px;color:var(--muted)}
.fan-card .p{display:block;color:var(--o-ink);font-weight:500}
.fan-card .by{display:block;margin:6px 0 2px;font-size:13px;font-weight:600;color:var(--s)}
.fan-card ul{margin:0;padding-left:16px;color:var(--s-ink);font-size:14.5px}
.fan-card li{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.callout cite{display:block;margin-top:4px;font-style:normal;font-size:14px;color:var(--muted)}

/* task panel: no box, just a hairline above; statement on the left, ratings on the right */
.m-key{grid-column:1/-1;justify-self:start;margin-top:4px;padding:0;border:0;background:none;font:inherit;font-size:19px;font-weight:600;color:var(--ink);cursor:pointer;border-bottom:1.5px solid currentColor}
.m-key:hover{color:var(--s)}
.detail{--bar:var(--s); --dot:var(--s);
  width:100%;min-height:200px;border-top:1px solid var(--rule);padding-top:24px;display:grid;grid-template-columns:minmax(0,1fr);gap:32px;align-content:start}
.detail.o{--bar:var(--o); --dot:var(--o)}
.detail.empty{align-content:start}
.d-main{display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:20px;min-height:0}
.d-meta{display:flex;align-items:center;gap:8px;font-size:20px;color:var(--muted)}
.d-meta i{width:10px;height:10px;border-radius:50%;background:var(--dot);flex:none}
.detail .d-text{margin:0;max-width:none;min-height:0;font-size:26px;font-weight:500;line-height:34px;letter-spacing:-.01em;text-wrap:pretty}
.detail .d-hint{margin:0;font-size:18.5px;color:var(--muted)}
.links{list-style:none;margin:0;padding:0;overflow:visible;align-content:start}   /* a fixed box: the ratings below stay put from task to task */
.links li+li{border-top:1px solid var(--rule)}
.links button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:8px 1fr;gap:4px 10px;width:100%;padding:9px 0;cursor:pointer;font-size:20px;line-height:1.45;color:var(--muted)}
.links button i{width:6px;height:6px;border-radius:50%;margin-top:7px}
.links button em{font-style:normal;color:var(--ink);opacity:.45;font-size:inherit;margin-right:6px}
.links button:hover,.links button:focus-visible{color:var(--ink)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:20px 44px;align-content:start}
.m{display:grid;grid-template-columns:1fr auto;gap:10px 8px;align-items:baseline;align-content:start}   /* bars sit at the same height in both columns */
.m-l{font-size:19px;font-weight:400;color:var(--muted)}   /* the name recedes; the value carries the weight */
.m-v{font-size:19px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.m-steps{grid-column:1 / -1;display:grid;gap:3px;height:4px}
.m-steps i{height:4px;border-radius:2px;background:var(--rule)} .m-steps i.on{background:var(--bar)}   /* same weight and colours as the bars */
.m-steps i.part{background:linear-gradient(90deg,var(--bar) var(--p),var(--rule) var(--p))}
.m-ends{grid-column:1 / -1;display:flex;justify-content:space-between;margin-top:-2px;font-size:15px;color:var(--muted)}
.m-bar{grid-column:1 / -1;height:4px;background:var(--rule);border-radius:2px}
.m-bar i{display:block;height:100%;border-radius:2px;background:var(--bar)}

/* ---- layout: the task beside the Venn, its ratings as a full-width band of cards underneath ---- */
@media (min-width:901px){
  .story,.step.explore,.detail{display:contents}
  .scrolly{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);grid-template-rows:auto 1fr auto;gap:0 64px}
  .step.explore > p{grid-column:1;grid-row:1;padding-top:64px;margin-bottom:20px}
  .d-main{grid-column:1;grid-row:2;align-content:start;padding-top:20px;border-top:1px solid var(--rule)}
  .stage-wrap{grid-column:2;grid-row:1 / 3;align-self:start}
  .stage{height:620px;padding-top:110px}
  .metrics{grid-column:1 / -1;grid-row:3;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 56px;margin-top:32px;padding-top:32px;border-top:1px solid var(--rule)}
  /* read in the ratings' own groups: is it part of the job, how the work happens, expertise, can it be checked */
  .metrics > :nth-child(1){order:1} .metrics > :nth-child(2){order:2} .metrics > :nth-child(3){order:3} .metrics > :nth-child(5){order:4}
  .metrics > :nth-child(7){order:5} .metrics > :nth-child(4){order:6} .metrics > :nth-child(6){order:7} .metrics > :nth-child(8){order:8} .metrics > :nth-child(9){order:9}
}
/* the ratings sit in a plain band: no card around each */
.metrics .m-key{margin-top:4px}
.metrics > .m-note{order:9} .metrics > .m-key{order:10}
.detail .m-note{grid-column:1/-1;max-width:none;margin:0;max-width:none;font-size:19px;line-height:1.5;color:var(--muted)}
@media (max-width:900px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px}}
@media (max-width:560px){.metrics{grid-template-columns:minmax(0,1fr)}}



/* ---- links: grouped under one heading per relation ---- */
.links{display:grid;gap:18px;height:auto;overflow:visible}
.lg{display:grid;gap:8px}
.detail .lg-h{margin:0;max-width:none;font-size:20px;font-weight:400;color:var(--muted)}   /* sentence case: it reads as a phrase */
.lg ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.lg li+li{border-top:0}
.links .lg button{grid-template-columns:1fr;padding:0;color:var(--ink);font-size:19px;line-height:1.45}
.links .lg button i{display:none}
.links .lg button:not([disabled]):hover span{text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
/* each linked task on a pale block of the other inventory's colour */
.lg ul{gap:10px} .lg li{padding:12px 16px;border-radius:2px;background:var(--o-tint)}
.detail.o .lg li{background:var(--s-tint)}
</style>
</head>

/* ---------------- fan view of refinement: broad O*NET tasks in turn, each with its refining statements ---------------- */
const FAN_T = 6000;
const fan = {node:null, kids:[], g:null, card:null, timer:null, at:0, list:null};
function fanList(){
  const ok = [...nodes].filter(o => o.hidden && o.links.filter(l => o.rel.get(l) === "refines").length >= 3);
  const byOcc = new Map();
  for (const o of ok.sort((a, b) => b.links.length - a.links.length)) { if (!byOcc.has(o.occ)) byOcc.set(o.occ, []); byOcc.get(o.occ).push(o); }

}
function clearFan(){

}
function showFan(){

  const few = innerWidth <= 900 ? 0 : 3, more = kids.length - few;

    + (few ? `<ul>${kids.slice(0, few).map(k => `<li>${esc(k.text)}</li>`).join("")}${more > 0 ? `<li style="list-style:none;color:var(--muted)">+${more} more</li>` : ""}</ul>` : "");

}
function placeFan(){
  if (!fan.card) return;
  const v = vennExtent(), w = Math.min(stage.clientWidth - 16, 440);
  fan.card.style.width = w + "px";
  const x = clamp(v.cx - w/2, 8, stage.clientWidth - w - 8), y = v.bottom + 22;
  fan.card.style.transform = `translate(${x}px,${y}px)`;

    const L = Math.hypot(e.x - d.x, e.y - d.y) || 1, from = {x:d.x + (e.x - d.x)/L*r, y:d.y + (e.y - d.y)/L*r};

function runFan(on){

function setStep(name){

  if (scene.pin !== undefined) selected = scene.pin ? byId.get(scene.pin) || null : null;
  if (!interactive) hover = null;

const phone = matchMedia("(max-width:900px)").matches;
const seen = new IntersectionObserver(es => { for (const e of es) if (e.isIntersecting) setStep(e.target.dataset.step); },
  {rootMargin:phone ? "-58% 0px -36% 0px" : "-45% 0px -45% 0px"});
for (const el of document.querySelectorAll(".step")) seen.observe(el);
/* scroll-linked fade: a step's text comes up as it rises into the reading band and goes as it leaves

const fading = [...document.querySelectorAll(".step:not(.linger)")];
let fadeQueued = false;
function fade(){

  for (const el of fading) {
    const kids = [...el.children], r0 = kids[0].getBoundingClientRect(), r1 = kids[kids.length - 1].getBoundingClientRect();
    const o = Math.min(clamp((bottom - r0.top)/band, 0, 1), clamp((r1.bottom - top)/band, 0, 1));

const queueFade = () => { if (!fadeQueued) { fadeQueued = true; requestAnimationFrame(fade); } };
addEventListener("scroll", queueFade, {passive:true});
/* a soft lock: once scrolling stops near a step, glide so its text sits in the reading spot

let settleTimer, settling = false;

  let best = null, bd = Infinity;

    const kids = [...el.children], r0 = kids[0].getBoundingClientRect(), r1 = kids[kids.length - 1].getBoundingClientRect();

addEventListener("scroll", () => { if (settling) return; clearTimeout(settleTimer); settleTimer = setTimeout(settle, 220); }, {passive:true});
addEventListener("resize", queueFade);
fade();
setStep("explore");   /* embedded at the top of the dashboard; the walkthrough lives in the video */
/* tell the dashboard how tall this is, so its frame fits with no inner scrollbar */
const tellHeight = () => parent.postMessage({tasknetExplorerHeight: Math.ceil(document.querySelector("main").getBoundingClientRect().height)}, "*");   /* the content, not the frame */
new ResizeObserver(tellHeight).observe(document.body); addEventListener("load", tellHeight);
